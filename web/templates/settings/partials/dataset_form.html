<div id="edit-dataset-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">データセットを編集</h3>
                <button onclick="document.getElementById('edit-dataset-modal').remove()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form hx-put="/settings/datasets/{{ dataset.id }}"
                  hx-target="#dataset-list"
                  hx-swap="innerHTML"
                  hx-on::after-request="if(event.detail.successful) document.getElementById('edit-dataset-modal').remove()"
                  x-data='{ columns: {{ dataset.columns | tojson }} }'
                  x-init="$watch('columns', v => $refs.columnsJson.value = JSON.stringify(v))">
                <input type="hidden" name="columns_json" x-ref="columnsJson" :value="JSON.stringify(columns)">

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">データセット名 <span class="text-red-500">*</span></label>
                    <input type="text" name="name" required value="{{ dataset.name }}"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    />
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">説明</label>
                    <textarea name="description" rows="2"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >{{ dataset.description or '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">補足情報</label>
                    <textarea name="notes" rows="2"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >{{ dataset.notes or '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">カラム</label>
                    <div class="border rounded-lg overflow-hidden">
                        <table class="min-w-full text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">カラム名</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">型</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">説明（任意）</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <template x-for="(col, index) in columns" :key="index">
                                    <tr>
                                        <td class="px-3 py-2 font-mono text-gray-900" x-text="col.name"></td>
                                        <td class="px-3 py-2">
                                            <select class="border rounded px-2 py-1 text-sm" x-model="col.data_type">
                                                <option value="string">string</option>
                                                <option value="integer">integer</option>
                                                <option value="float">float</option>
                                                <option value="date">date</option>
                                                <option value="datetime">datetime</option>
                                                <option value="boolean">boolean</option>
                                            </select>
                                        </td>
                                        <td class="px-3 py-2">
                                            <input type="text" class="border rounded px-2 py-1 text-sm w-full"
                                                placeholder="カラムの説明" x-model="col.description">
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="document.getElementById('edit-dataset-modal').remove()"
                            class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
