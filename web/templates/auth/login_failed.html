{% extends "auth/layout.html" %}
{# M5. 公開構成のログイン失敗画面（AC1.1.3、BR1.4）。失敗の詳細は出さずログにだけ出す。 #}
{% block content %}
<div data-testid="login-failed" role="alert">
    <p class="text-gray-900 font-medium">ログインできませんでした。</p>
    <p class="text-gray-700 mb-6">もう一度お試しください。</p>
    <a href="/login"
       data-testid="login-retry-button"
       class="block w-full text-center px-4 py-3 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700">
        もう一度ログインする
    </a>
</div>
{% endblock %}
