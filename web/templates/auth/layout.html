{% from "components/icons.html" import icon_cpu_chip %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AIペルソナシステム</title>
    <link rel="stylesheet" href="{{ static_url('css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/custom.css') }}">
</head>
{# ログイン関連の画面は画面上部（M1）を出さず、ログイン専用の簡素な枠を使う（mockups.md M2・M5） #}
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-md">
        <p class="flex items-center justify-center gap-2 mb-6 text-xl font-bold text-gray-900">
            {{ icon_cpu_chip("w-7 h-7 text-blue-600") }} AIペルソナシステム
        </p>
        <div class="bg-white shadow-sm border rounded-lg p-8">
            {% block content %}{% endblock %}
        </div>
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
