name: CDK

# すべての PR と push で動かす（U9、NFR7.14）。jest に cdk-nag・IAM・論理 ID のテストが入り、
# cdk/ を変えない PR でも Stage の組み立てを壊していないことを毎回確かめる。
# ジョブの ID（synth）はブランチ保護の必須チェックの名前なので変えず、name: も付けない
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: cdk
        run: npm ci

      - name: TypeScript compile check
        working-directory: cdk
        run: npx tsc --noEmit

      - name: Jest tests
        working-directory: cdk
        run: npm test

      - name: CDK synth
        working-directory: cdk
        run: npx cdk synth --no-staging
