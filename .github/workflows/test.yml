name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  # ログイン方式（v1.0.0）。テストは手元専用の local で動かす（tests/conftest.py でも設定する）
  AUTH_MODE: local
  DYNAMODB_TABLE_PREFIX: Test
  DYNAMODB_REGION: us-east-1
  ENABLE_LONG_TERM_MEMORY: "false"
  ENABLE_DATASET_INTEGRATION: "false"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      # カバレッジは unit・integration・api のデータを coverage ジョブで合わせて判定する（U9、NFR7.12）
      - name: Run unit tests
        run: uv run pytest -m unit --cov=src --cov=web --cov-report= -q
        env:
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        run: uv run pytest -m integration --cov=src --cov=web --cov-report= -q
        env:
          COVERAGE_FILE: .coverage.integration

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  api:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run API tests
        run: uv run pytest -m api --cov=src --cov=web --cov-report= -q
        env:
          COVERAGE_FILE: .coverage.api

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-api
          path: .coverage.api
          include-hidden-files: true
          if-no-files-found: error

  # unit・integration・api のカバレッジを合わせ、src と web の行カバレッジが 80% を下回ったら
  # 失敗させる（U9、NFR7.12、team.md の Testing Posture）。ui と e2e は数に入れない。
  # 上流のどれかが失敗するとこのジョブは skipped になる（そのときは失敗したジョブでマージが止まる）
  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration, api]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage
        run: uv run coverage combine

      - name: Check the 80% floor
        run: uv run coverage report --fail-under=80

      - name: Write coverage.xml
        if: always()
        run: uv run coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # 画面の部品の振る舞いと axe-core の検査（U3、NFR7.2）。Playwright の Chromium で
  # 部品の画面を読み込む。起動中のアプリも実 AWS も使わない（E2E とは別）。
  # GitHub Actions は CI=true を設定するため、Chromium が無ければ skip ではなく失敗する
  ui:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run UI component tests
        run: uv run pytest -m ui -q
