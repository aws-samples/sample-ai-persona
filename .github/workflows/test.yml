name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  # ログイン方式（v1.0.0）。テストは手元専用の local で動かす（tests/conftest.py でも設定する）
  AUTH_MODE: local
  DYNAMODB_TABLE_PREFIX: Test
  DYNAMODB_REGION: us-east-1
  ENABLE_LONG_TERM_MEMORY: "false"
  ENABLE_DATASET_INTEGRATION: "false"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -m unit --cov=src --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        run: uv run pytest -m integration -q

  api:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run API tests
        run: uv run pytest -m api -q

  # 画面の部品の振る舞いと axe-core の検査（U3、NFR7.2）。Playwright の Chromium で
  # 部品の画面を読み込む。起動中のアプリも実 AWS も使わない（E2E とは別）。
  # GitHub Actions は CI=true を設定するため、Chromium が無ければ skip ではなく失敗する
  ui:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run UI component tests
        run: uv run pytest -m ui -q
